name: Sync, Convert, and Build

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java (Zulu, Maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 23
          java-package: jdk
          architecture: x64

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull from upstream
        run: |
          git clone https://github.com/SlimefunGuguProject/ExtraGear.git

      - name: Install OpenCC
        run: sudo apt-get update && sudo apt-get install -y opencc

      - name: Convert .java files to Traditional Chinese
        run: |
          find ExtraGear/src -type f -name "*.java" \
            | while read file; do
                opencc -i "$file" -o "$file.tmp" -c s2twp.json && mv "$file.tmp" "$file"
              done

      - name: Convert zh-CN.yml to zh-TW.yml
        run: |
          if [ -f ExtraGear/src/main/resources/languages/zh-CN.yml ]; then
            cp ExtraGear/src/main/resources/languages/zh-CN.yml ExtraGear/src/main/resources/languages/zh-TW.yml
            opencc -i ExtraGear/src/main/resources/languages/zh-TW.yml -o ExtraGear/src/main/resources/languages/zh-TW.yml -c s2twp.json
          fi

      - name: Replace zh-CN with zh-TW in config.yml
        run: |
          find ExtraGear -name config.yml -exec sed -i 's/zh-CN/zh-TW/g' {} \;

      - name: Build Java project
        run: |
          cd ExtraGear
          mvn package --file pom.xml

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-jar
          path: ExtraGear/target/*.jar
