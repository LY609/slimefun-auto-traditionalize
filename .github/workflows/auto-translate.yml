name: Sync, Convert, and Build

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月 1 號 00:00 執行
  workflow_dispatch:      # 手動觸發支援

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          architecture: x64

      - name: Checkout your repository
        uses: actions/checkout@v3

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone Galactifun
        run: git clone https://github.com/SlimefunGuguProject/Galactifun.git

      - name: Install OpenCC
        run: sudo apt-get update && sudo apt-get install -y opencc

      - name: Convert .java & .yml to Traditional Chinese (Taiwan)
        run: |
          find Galactifun -type f \( -name "*.java" -o -name "*.yml" \) -print \
            | while read file; do
                opencc -i "$file" -o "$file.tmp" -c s2twp.json && mv "$file.tmp" "$file"
              done

      - name: Replace zh-CN with zh-TW in config.yml
        run: |
          find Galactifun -name config.yml -exec sed -i 's/zh-CN/zh-TW/g' {} \;

      - name: Make gradlew executable
        run: chmo
